[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mql-audit"
version = "0.1.0"
description = "CP-SAT degree auditing for MQL semantic IR"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mateo Rodriguez", email = "mateotrodriguez@gmail.com" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "ortools>=9.15,<10",
  "pylibmql>=0.3,<0.4",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/majoraudit/mql-audit"
Repository = "https://github.com/majoraudit/mql-audit"
Issues = "https://github.com/majoraudit/mql-audit/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.8",
  "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mql_audit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: exhaustive cross-repository and fuzz tests",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["arg-type", "assignment", "comparison-overlap", "no-any-return", "operator", "return-value", "union-attr"]
packages = ["mql_audit"]
