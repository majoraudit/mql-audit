name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 builds are not published for the Ubuntu 26.04 runner image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Check out normative MQL fixtures
        uses: actions/checkout@v4
        with:
          repository: majoraudit/major-requirement-parser
          path: upstream-parser
      - name: Check out Yale major programs
        uses: actions/checkout@v4
        with:
          repository: majoraudit/majors
          path: upstream-majors
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
        env:
          MQL_REFERENCE_FIXTURES: upstream-parser/docs/fixtures/semantic-ir/reference-fixtures.json
          MQL_MAJORS_ROOT: upstream-majors/majors/2627
      - run: ruff check src tests
      - run: mypy src
      - run: python -m build
      - run: twine check dist/*

